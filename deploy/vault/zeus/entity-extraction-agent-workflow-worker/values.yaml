# Vault Path: app-configuration/ferma-congress/zeus/entity-extraction-agent-workflow-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-workflow-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: micro  # 250m CPU / 512Mi - lightweight orchestration

  entrypoint:
    enabled: true
    command: "/app/entity-extraction-agent/.venv/bin/python -m src.temporal.workers.workflow_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot

keda_config:
  type: temporal
  max_replicas: 3
  pollingInterval: 30

  temporal:
    namespace: entity-extraction-agent
    taskqueue: extraction-workflows
    endpoint: zeus-temporal-server-service.zeus-temporal-app.svc.cluster.local:7233
    queuesize: "1"
