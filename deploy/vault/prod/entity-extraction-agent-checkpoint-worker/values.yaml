# Vault Path: app-configuration/ferma-congress/prod/entity-extraction-agent-checkpoint-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-checkpoint-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: nano  # 100m CPU / 128Mi

  entrypoint:
    enabled: true
    command: "python -m src.temporal.workers.checkpoint_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot

keda_config:
  type: temporal
  max_replicas: 2
  pollingInterval: 15

  temporal:
    namespace: entity-extraction-agent
    taskqueue: checkpoint-storage
    endpoint: prod-temporal-server-service.prod-temporal-app.svc.cluster.local:7233
    queuesize: "30"
