# Vault Path: app-configuration/ferma-congress/prod/entity-extraction-agent-result-storage-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-result-storage-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: micro  # 250m CPU / 512Mi - I/O bound GCS uploads

  entrypoint:
    enabled: true
    command: "/app/entity-extraction-agent/.venv/bin/python -m src.temporal.workers.result_storage_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot

keda_config:
  type: temporal
  max_replicas: 10
  pollingInterval: 15

  temporal:
    namespace: entity-extraction-agent
    taskqueue: result-storage
    endpoint: prod-temporal-server-service.prod-temporal-app.svc.cluster.local:7233
    queuesize: "30"
