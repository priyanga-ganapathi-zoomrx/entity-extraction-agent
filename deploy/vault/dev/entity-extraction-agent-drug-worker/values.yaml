# Vault Path: app-configuration/ferma-congress/dev/entity-extraction-agent-drug-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-drug-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: small  # 500m CPU / 1024Mi - LLM calls, 15 concurrent activities

  entrypoint:
    enabled: true
    command: "python -m src.temporal.workers.drug_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot-spot

keda_config:
  type: temporal
  max_replicas: 2
  pollingInterval: 30

  temporal:
    namespace: entity-extraction-agent
    taskqueue: drug-activities
    endpoint: dev-temporal-server-service.dev-temporal-app.svc.cluster.local:7233
    queuesize: "1"
