# Vault Path: app-configuration/ferma-congress/dev/entity-extraction-agent-drug-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-drug-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: small  # 500m CPU / 1024Mi - LLM calls, 15 concurrent activities

  entrypoint:
    enabled: true
    command: "/app/entity-extraction-agent/.venv/bin/python -m src.temporal.workers.drug_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot

keda_config:
  type: temporal
  max_replicas: 20
  pollingInterval: 30

  temporal:
    namespace: default
    taskqueue: drug-activities
    endpoint: temporal-frontend:7233
    queuesize: "5"
