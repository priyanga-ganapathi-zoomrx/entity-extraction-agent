# Vault Path: app-configuration/ferma-congress/dev/entity-extraction-agent-workflow-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-workflow-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: micro  # 250m CPU / 512Mi - lightweight orchestration

  entrypoint:
    enabled: true
    command: "/app/entity-extraction-agent/.venv/bin/python -m src.temporal.workers.workflow_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot-spot

keda_config:
  type: temporal
  max_replicas: 5
  pollingInterval: 30

  temporal:
    namespace: default
    taskqueue: extraction-workflows
    endpoint: temporal-frontend:7233
    queuesize: "1"
