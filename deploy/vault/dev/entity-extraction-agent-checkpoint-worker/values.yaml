# Vault Path: app-configuration/ferma-congress/dev/entity-extraction-agent-checkpoint-worker/values.yaml
# Key: values

chart_version: 3.1.0
kind: keda
product: ferma-congress

application_config:
  name: entity-extraction-agent-checkpoint-worker
  type: backend

  image:
    name: entity-extraction-agent

  resource:
    preset: micro  # 250m CPU / 512Mi - I/O bound storage operations

  entrypoint:
    enabled: true
    command: "python -m src.temporal.workers.checkpoint_worker"

  filebeat:
    enabled: false

  volume_mount: "/app/entity-extraction-agent"
  nodepool: autopilot-spot

keda_config:
  type: temporal
  max_replicas: 1
  pollingInterval: 30

  temporal:
    namespace: entity-extraction-agent
    taskqueue: checkpoint-storage
    endpoint: dev-temporal-server-service.dev-temporal-app.svc.cluster.local:7233
    queuesize: "1"
